# SİNYAL'i GitHub Pages'te yayınlar: her 20 dakikada bir tüm kaynakları tarar,
# yeni haberleri Türkçeye çevirir ve siteyi günceller. Bilgisayarının açık olması gerekmez.
name: SİNYAL — güncelle ve yayınla

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sinyal-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Önceki taramanın önbelleğini geri yükle
        uses: actions/cache/restore@v4
        with:
          path: data
          key: sinyal-data-${{ github.run_id }}
          restore-keys: sinyal-data-

      - name: Bağımlılıklar (yalnızca yapay zekâ özeti için)
        run: npm ci --omit=dev --no-fund --no-audit

      - name: Kaynakları tara, çevir ve siteyi derle
        run: node build.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Önbelleği kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: sinyal-data-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
