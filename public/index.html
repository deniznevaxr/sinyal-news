<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SİNYAL — Ses, Müzik ve Görsel Teknoloji Haberleri</title>
  <meta name="description" content="Ses, müzik ve görsel teknolojilerdeki gelişmeleri haber siteleri, GitHub, Hugging Face, arXiv, Hacker News, Reddit ve YouTube'dan toplayan, Türkçeye çeviren haber paneli.">
  <meta name="theme-color" content="#0c0d10">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SİNYAL">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <!-- iPhone launch screens (iOS does not draw one from the manifest) -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1320x2868.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1260x2736.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1242x2688.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1242x2208.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1206x2622.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-750x1334.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply saved theme and language before first paint (no flash).
    try {
      const p = JSON.parse(localStorage.getItem('sinyal.prefs') || '{}');
      if (p.theme === 'light' || (p.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.dataset.theme = 'light';
      if (JSON.parse(localStorage.getItem('sinyal.lang') || '"tr"') === 'en') document.documentElement.lang = 'en';
    } catch {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">İçeriğe geç</a>
  <header class="top">
    <div class="top-row">
      <a class="brand" href="./" data-action="home" aria-label="SİNYAL ana sayfa">
        <svg class="brand-mark" viewBox="0 0 24 20" aria-hidden="true"><rect x="0" y="7" width="3" height="6" rx="1.2"/><rect x="5" y="3" width="3" height="14" rx="1.2"/><rect x="10" y="0" width="3" height="20" rx="1.2"/><rect x="15" y="4" width="3" height="12" rx="1.2"/><rect x="20" y="7" width="3" height="6" rx="1.2"/></svg>
        <span><span class="brand-name">SİNYAL</span><span class="brand-tag" id="tagline"></span></span>
      </a>
      <nav class="domains" id="domains" aria-label="Alan"></nav>
      <div class="top-tools">
        <button class="install-btn" type="button" data-action="install" id="install-btn" hidden>
          <svg class="i sm" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg>
          <span></span>
        </button>
        <button class="search-btn" type="button" data-action="palette" id="search-btn">
          <svg class="i sm" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.75"/><path d="M10.5 10.5 14 14"/></svg>
          <span></span><kbd>Ctrl K</kbd>
        </button>
        <div class="lang" role="group" aria-label="Dil / Language">
          <button type="button" data-action="lang" data-v="tr">TR</button>
          <button type="button" data-action="lang" data-v="en">EN</button>
        </div>
        <button class="icon-btn" type="button" data-action="section" data-v="saved" id="saved-btn" aria-label="Kaydedilenler">
          <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h8v11l-4-2.8-4 2.8z"/></svg>
        </button>
        <button class="icon-btn" type="button" data-action="theme" id="theme-btn" aria-label="Tema">
          <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-btn" type="button" data-action="settings" id="settings-btn" aria-label="Ayarlar">
          <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.6"/><circle cx="5.5" cy="11.5" r="1.6"/></svg>
        </button>
        <button class="icon-btn" type="button" data-action="quit" id="quit-btn" aria-label="Kapat" title="Kapat" hidden>
          <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v5.5"/><path d="M4.6 4.2a5 5 0 1 0 6.8 0"/></svg>
        </button>
      </div>
    </div>
    <div class="sections-row">
      <nav class="sections" id="sections" aria-label="Bölümler"></nav>
      <button class="status" id="status" type="button" data-action="settings" data-state="connecting"><span class="live-dot"></span><span class="status-text"></span></button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Bölümler"></nav>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet-wrap" id="sheet" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="palette" id="palette" role="dialog" aria-modal="true" hidden></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
